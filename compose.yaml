name: backupsentinel

services:
  backup-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: backup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: backups
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backup -d backups"]
      interval: 5s
      timeout: 5s
      retries: 10

  backup-service:
    image: backupsentinel-backup-service
    build: ./services/backup-service
    environment:
      DATABASE_URL: postgresql+asyncpg://backup:${POSTGRES_PASSWORD:-local-development-only}@backup-db:5432/backups
      BACKUP_STORAGE_PATH: /data/backups
    volumes:
      - backup_files:/data/backups
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      backup-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  outbox-publisher:
    image: backupsentinel-backup-service
    build: ./services/backup-service
    command: ["python", "-m", "backup_app.publisher"]
    environment:
      DATABASE_URL: postgresql+asyncpg://backup:${POSTGRES_PASSWORD:-local-development-only}@backup-db:5432/backups
    depends_on:
      backup-db:
        condition: service_healthy

  backup-worker:
    image: backupsentinel-backup-service
    build: ./services/backup-service
    command: ["celery", "-A", "backup_app.celery_app:app", "worker", "-Q", "backup", "--loglevel=info", "--concurrency=1"]
    environment:
      DATABASE_URL: postgresql+asyncpg://backup:${POSTGRES_PASSWORD:-local-development-only}@backup-db:5432/backups
    depends_on:
      backup-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  verification-worker:
    image: backupsentinel-verification-service
    build: ./services/verification-service
    command: ["celery", "-A", "verification_app.celery_app:app", "worker", "-Q", "verification", "--loglevel=info", "--concurrency=1"]
    environment:
      BACKUP_VOLUME_NAME: backupsentinel_backup_files
    volumes:
      - backup_files:/data/backups:ro
    depends_on:
      backup-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  verification-service:
    image: backupsentinel-verification-service
    build: ./services/verification-service
    volumes:
      - backup_files:/data/backups:ro
    environment:
      BACKUP_VOLUME_NAME: backupsentinel_backup_files
      BACKUP_STORAGE_PATH: /data/backups
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      - backup-service

  monitoring-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: ${MONITORING_POSTGRES_PASSWORD:-local-monitoring-only}
      POSTGRES_DB: monitoring
    volumes:
      - monitoring_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoring -d monitoring"]
      interval: 5s
      timeout: 5s
      retries: 10

  monitoring-service:
    image: backupsentinel-monitoring-service
    build: ./services/monitoring-service
    environment:
      DATABASE_URL: postgresql+asyncpg://monitoring:${MONITORING_POSTGRES_PASSWORD:-local-monitoring-only}@monitoring-db:5432/monitoring
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      monitoring-db:
        condition: service_healthy

  monitoring-worker:
    image: backupsentinel-monitoring-service
    build: ./services/monitoring-service
    command: ["celery", "-A", "monitoring_app.celery_app:app", "worker", "-Q", "monitoring", "--loglevel=info", "--concurrency=1"]
    environment:
      DATABASE_URL: postgresql+asyncpg://monitoring:${MONITORING_POSTGRES_PASSWORD:-local-monitoring-only}@monitoring-db:5432/monitoring
    depends_on:
      monitoring-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backup-service:
        condition: service_started

  monitoring-beat:
    image: backupsentinel-monitoring-service
    build: ./services/monitoring-service
    command: ["celery", "-A", "monitoring_app.celery_app:app", "beat", "--loglevel=info", "--schedule=/data/celerybeat-schedule"]
    volumes:
      - monitoring_beat_data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  backup_files:
  postgres_data:
  redis_data:
  monitoring_data:
  monitoring_beat_data:
