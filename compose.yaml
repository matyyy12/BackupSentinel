name: backupsentinel

services:
  backup-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: backup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: backups
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backup -d backups"]
      interval: 5s
      timeout: 5s
      retries: 10

  backup-service:
    build: ./services/backup-service
    environment:
      DATABASE_URL: postgresql+asyncpg://backup:${POSTGRES_PASSWORD:-local-development-only}@backup-db:5432/backups
      BACKUP_STORAGE_PATH: /data/backups
    volumes:
      - backup_files:/data/backups
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      backup-db:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  verification-service:
    build: ./services/verification-service
    volumes:
      - backup_files:/data/backups:ro
    environment:
      BACKUP_VOLUME_NAME: backupsentinel_backup_files
      BACKUP_STORAGE_PATH: /data/backups
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      - backup-service

  monitoring-service:
    build: ./services/monitoring-service
    ports:
      - "127.0.0.1:8002:8000"

volumes:
  backup_files:
  postgres_data:
  redis_data:
