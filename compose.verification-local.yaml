services:
  verification-service:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock

  verification-worker:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
